name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-release-tests:
    name: Python release regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt && pip install pytest pytest-asyncio
      - run: pytest -q tests/test_low_spec_io_stabilization.py tests/test_i18n_progress.py tests/test_query_operations_stability.py tests/test_thesis_tracking.py tests/test_thesis_tracking_v2.py
      - run: python -m compileall dashboard tests scripts
  full-historical-tests:
    name: Full historical pytest (advisory)
    # Some historical AI golden checks and Phase4 audit checks require an
    # immutable research store/artifacts that are deliberately not public.
    # Keep the suite visible, but do not make an absent private dataset a
    # release gate for the public, reproducible source tree.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt && pip install pytest pytest-asyncio
      - run: pytest -q
  python-lint:
    name: Lightweight Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      # Existing compact legacy modules are style-incompatible; retain a correctness-only gate.
      - run: flake8 dashboard tests rules_blueprint.py --select=E9,F821,F822,F823 --count
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run api:check
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
  browser-smoke:
    name: Browser smoke (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:smoke
  docker-configuration:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose declares .env as a runtime env_file.  CI intentionally uses only
      # the committed placeholder template; no production credentials are needed.
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build paper-api frontend
