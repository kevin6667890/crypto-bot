name: crypto-bot
services:
  audit-worker:
    profiles:
      - ai6b-candidate
    cap_drop:
      - ALL
    cpus: 0.2
    command:
      - python
      - scripts/run_ai_audit_worker.py
      - --database
      - /var/lib/ai-report/ai_market_reports.db
    environment:
      AI_MACRO_HTTP_FETCH_ENABLED: "false"
      AI_MARKET_ANALYSIS_PRESENTATION_ENABLED: "false"
      AI_MARKET_REPORT_SHADOW_ONLY: "true"
      AI_MARKET_REPORT_WORKER_ENABLED: "false"
      AI_MARKET_REPORTS_ENABLED: "false"
      AI_REPORT_AUDIT_ENABLED: "true"
      AI_REPORT_AUDIT_WORKER_ENABLED: "true"
      AI_REPORT_AUTO_AUDIT_ENABLED: "false"
      AI_REPORT_EVALUATION_ENABLED: "false"
      AI_REPORT_KILL_SWITCH_FILE: /var/lib/ai-report/live-provider-disabled.json
      AI_REPORT_LIVE_PROVIDER_ENABLED: "false"
      AI_USER_POSITION_PLANS_ENABLED: "false"
      AI6B_KILL_SWITCH_AUTOMATION_ENABLED: "true"
      AI6B_PRIVACY_SCOPE_ENFORCED: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from dashboard.ai_market_analysis.report_audit_repository import AuditRepository;
          assert AuditRepository('/var/lib/ai-report/ai_market_reports.db').schema_version()
      timeout: 5s
      interval: 30s
      retries: 3
    image: sha256:2f8ead2d6a53b060fb3d08ca9364b1febb879e713e599eecf7e58de6757fbef2
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m
    mem_limit: "268435456"
    networks:
      default: null
    pids_limit: 64
    read_only: true
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/logs:rw,noexec,nosuid,size=32m
    user: 10001:10001
    volumes:
      - type: volume
        source: ai-report-data
        target: /var/lib/ai-report
        volume: {}
  b4-supervisor:
    cap_drop:
      - ALL
    cpus: 0.2
    command:
      - python
      - /opt/ai6b-b4/b4_supervisor.py
    container_name: ai6b-b4-supervisor-626b2e6
    environment:
      AI_REPORT_KILL_SWITCH_FILE: /var/lib/ai-report/live-provider-disabled.json
      B4_END_EARLIEST_UTC: "2026-08-18T05:12:58Z"
      B4_END_EPOCH: "1787029978"
      B4_START_EPOCH: "1786943578"
      B4_START_UTC: "2026-08-17T05:12:58Z"
    image: sha256:2f8ead2d6a53b060fb3d08ca9364b1febb879e713e599eecf7e58de6757fbef2
    mem_limit: "268435456"
    networks:
      default: null
    pids_limit: 64
    read_only: true
    restart: 'no'
    secrets:
      - source: admin_token
        target: /run/secrets/admin_token
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    user: 10001:10001
    volumes:
      - type: volume
        source: ai-report-data
        target: /var/lib/ai-report
        volume: {}
      - type: bind
        source: /opt/crypto-bot-ai6b-staging/626b2e6/b4/b4_supervisor.py
        target: /opt/ai6b-b4/b4_supervisor.py
        read_only: true
        bind: {}
      - type: bind
        source: /opt/crypto-bot-ai6b-staging/626b2e6/evidence
        target: /evidence
        bind: {}
  frontend:
    profiles:
      - ai6b-candidate
    cap_drop:
      - ALL
    cpus: 0.1
    depends_on:
      paper-api:
        condition: service_started
        required: true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/ || exit
          1
      timeout: 5s
      interval: 30s
      retries: 3
    image: crypto-bot-ai6b-frontend@sha256:a86be568bd3ba3f2716e8ce527c6d3df112c9051da83804dae8fad9e99722559
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m
    mem_limit: "134217728"
    networks:
      default: null
    pids_limit: 32
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8443
        published: "8443"
        protocol: tcp
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8443
        published: "443"
        protocol: tcp
    read_only: true
    restart: on-failure:3
    secrets:
      - source: tls_certificate
        target: /run/secrets/tls_certificate
      - source: tls_private_key
        target: /run/secrets/tls_private_key
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=700
      - /var/log/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
    user: 101:101
    volumes:
      - type: bind
        source: /opt/crypto-bot-ai6b-staging/public-edge/runtime/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {}
  microstructure-collector:
    command:
      - python
      - -m
      - dashboard.microstructure_collector
    environment:
      CANONICAL_MICROSTRUCTURE_HISTORY_DB_PATH: /app/data_cache/canonical_microstructure_history_v1.db
      GIT_COMMIT: 35a5b29dc2b7d29be4910f323d61edc63b9613e9
      MICROSTRUCTURE_DB_PATH: /app/data_cache/market_microstructure.db
      MICROSTRUCTURE_MAINTENANCE_ENABLED: "false"
      MICROSTRUCTURE_REALTIME_AGGREGATION_ENABLED: "true"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8770/health',
          timeout=12)
      timeout: 15s
      interval: 30s
      retries: 3
      start_period: 20s
    image: crypto-bot-canonical-app:35a5b29
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: /opt/crypto-bot/data_cache
        target: /app/data_cache
        bind: {}
  paper-api:
    profiles:
      - ai6b-candidate
    cap_drop:
      - ALL
    cpus: 0.55
    command:
      - python
      - -m
      - scripts.run_paper_api_with_secrets
    environment:
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      AI_MACRO_HTTP_FETCH_ENABLED: "false"
      AI_MARKET_ANALYSIS_PRESENTATION_ENABLED: "true"
      AI_MARKET_REPORT_DB_PATH: /var/lib/ai-report/ai_market_reports.db
      AI_MARKET_REPORT_SHADOW_ONLY: "true"
      AI_MARKET_REPORT_WORKER_ENABLED: "true"
      AI_MARKET_REPORTS_ENABLED: "true"
      AI_REPORT_ARCHIVE_MAX_DAYS: "365"
      AI_REPORT_AUDIT_ENABLED: "true"
      AI_REPORT_AUDIT_WORKER_CONCURRENCY: "1"
      AI_REPORT_AUDIT_WORKER_ENABLED: "true"
      AI_REPORT_AUTO_AUDIT_ENABLED: "false"
      AI_REPORT_CANARY_MAX_LIVE_REQUESTS: "0"
      AI_REPORT_COST_STATUS: B3_CONTROL_LEDGER
      AI_REPORT_DAILY_CURRENCY_CAP_USD: "2"
      AI_REPORT_DAILY_INPUT_TOKENS: "500000"
      AI_REPORT_DAILY_OUTPUT_TOKENS: "1000000"
      AI_REPORT_DAILY_TOTAL_TOKENS: "1500000"
      AI_REPORT_EVALUATION_ENABLED: "true"
      AI_REPORT_FULL_OUTPUT_TOKENS: "200000"
      AI_REPORT_GLOBAL_CONCURRENCY: "1"
      AI_REPORT_HOT_RETENTION_DAYS: "30"
      AI_REPORT_INPUT_USD_PER_MILLION: "0.14"
      AI_REPORT_LIVE_PROVIDER_ENABLED: "true"
      AI_REPORT_MODEL: deepseek-v4-flash
      AI_REPORT_OUTPUT_USD_PER_MILLION: "0.28"
      AI_REPORT_PER_INSTRUMENT_CONCURRENCY: "1"
      AI_REPORT_POSITION_OUTPUT_TOKENS: "200000"
      AI_REPORT_PRICE_SCHEDULE_VERSION: deepseek-official-2026-08-14T05:54:57Z
      AI_REPORT_PROVIDER: deepseek
      AI_REPORT_PROVIDER_RETRY_MAX: "3"
      AI_REPORT_QUEUE_MAX: "10"
      AI_REPORT_QUICK_OUTPUT_TOKENS: "200000"
      AI_REPORT_REQUEST_INPUT_TOKEN_MAX: "500000"
      AI_REPORT_TIMEOUT_SECONDS: "300"
      AI_REPORT_WORKER_CONCURRENCY: "1"
      AI_USER_POSITION_PLANS_ENABLED: "false"
      AI6B_KILL_SWITCH_AUTOMATION_ENABLED: "true"
      AI6B_PRIVACY_SCOPE_ENFORCED: "true"
      CANONICAL_MICROSTRUCTURE_HISTORY_DB_PATH: /var/lib/microstructure/canonical_microstructure_history_v1.db
      DEEPSEEK_API_KEY_FILE: /run/secrets/legacy_deepseek_key
      MICROSTRUCTURE_DB_PATH: /var/lib/microstructure/market_microstructure.db
      PAPER_API_HOST: 0.0.0.0
      PAPER_DB_PATH: /var/lib/paper/paper_trades.db
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/paper/flow/health',timeout=3)
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 15s
    image: sha256:2f8ead2d6a53b060fb3d08ca9364b1febb879e713e599eecf7e58de6757fbef2
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m
    mem_limit: "671088640"
    networks:
      default: null
    pids_limit: 128
    read_only: true
    restart: on-failure:3
    secrets:
      - source: admin_token
        target: /run/secrets/admin_token
      - source: legacy_deepseek_key
        target: /run/secrets/legacy_deepseek_key
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/logs:rw,noexec,nosuid,size=32m
    user: 10001:10001
    volumes:
      - type: volume
        source: paper-data
        target: /var/lib/paper
        volume: {}
      - type: volume
        source: microstructure-data
        target: /var/lib/microstructure
        read_only: true
        volume: {}
      - type: volume
        source: ai-report-data
        target: /var/lib/ai-report
        volume: {}
  report-worker:
    profiles:
      - ai6b-candidate
    cap_drop:
      - ALL
    cpus: 0.3
    command:
      - python
      - scripts/run_ai_report_worker.py
      - --database
      - /var/lib/ai-report/ai_market_reports.db
    environment:
      AI_MACRO_HTTP_FETCH_ENABLED: "false"
      AI_MARKET_ANALYSIS_PRESENTATION_ENABLED: "false"
      AI_MARKET_REPORT_SHADOW_ONLY: "true"
      AI_MARKET_REPORT_WORKER_ENABLED: "true"
      AI_MARKET_REPORTS_ENABLED: "true"
      AI_REPORT_API_KEY_FILE: /run/secrets/ai_report_provider_key
      AI_REPORT_ARCHIVE_MAX_DAYS: "365"
      AI_REPORT_AUDIT_ENABLED: "false"
      AI_REPORT_AUDIT_WORKER_CONCURRENCY: "1"
      AI_REPORT_AUDIT_WORKER_ENABLED: "false"
      AI_REPORT_AUTO_AUDIT_ENABLED: "false"
      AI_REPORT_CANARY_MAX_LIVE_REQUESTS: "0"
      AI_REPORT_COST_STATUS: B3_CONTROL_LEDGER
      AI_REPORT_DAILY_CURRENCY_CAP_USD: "2"
      AI_REPORT_DAILY_INPUT_TOKENS: "500000"
      AI_REPORT_DAILY_OUTPUT_TOKENS: "1000000"
      AI_REPORT_DAILY_TOTAL_TOKENS: "1500000"
      AI_REPORT_EVALUATION_ENABLED: "false"
      AI_REPORT_FULL_OUTPUT_TOKENS: "200000"
      AI_REPORT_GLOBAL_CONCURRENCY: "1"
      AI_REPORT_HOT_RETENTION_DAYS: "30"
      AI_REPORT_INPUT_USD_PER_MILLION: "0.14"
      AI_REPORT_KILL_SWITCH_FILE: /var/lib/ai-report/live-provider-disabled.json
      AI_REPORT_LIVE_PROVIDER_ENABLED: "true"
      AI_REPORT_MODEL: deepseek-v4-flash
      AI_REPORT_OUTPUT_USD_PER_MILLION: "0.28"
      AI_REPORT_PER_INSTRUMENT_CONCURRENCY: "1"
      AI_REPORT_POSITION_OUTPUT_TOKENS: "200000"
      AI_REPORT_PRICE_SCHEDULE_VERSION: deepseek-official-2026-08-14T05:54:57Z
      AI_REPORT_PROVIDER: deepseek
      AI_REPORT_PROVIDER_RETRY_MAX: "3"
      AI_REPORT_QUEUE_MAX: "10"
      AI_REPORT_QUICK_OUTPUT_TOKENS: "200000"
      AI_REPORT_REQUEST_INPUT_TOKEN_MAX: "500000"
      AI_REPORT_TIMEOUT_SECONDS: "300"
      AI_REPORT_WORKER_CONCURRENCY: "1"
      AI_USER_POSITION_PLANS_ENABLED: "false"
      AI6B_KILL_SWITCH_AUTOMATION_ENABLED: "true"
      AI6B_PRIVACY_SCOPE_ENFORCED: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from dashboard.ai_market_analysis.report_repository import ReportRepository;
          assert ReportRepository('/var/lib/ai-report/ai_market_reports.db').schema_version()
      timeout: 5s
      interval: 30s
      retries: 3
    image: sha256:2f8ead2d6a53b060fb3d08ca9364b1febb879e713e599eecf7e58de6757fbef2
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m
    mem_limit: "402653184"
    networks:
      default: null
    pids_limit: 64
    read_only: true
    restart: on-failure:3
    secrets:
      - source: ai_report_provider_key
        target: /run/secrets/ai_report_provider_key
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/logs:rw,noexec,nosuid,size=32m
    user: 10001:10001
    volumes:
      - type: volume
        source: ai-report-data
        target: /var/lib/ai-report
        volume: {}
networks:
  default:
    name: crypto-bot_default
    external: true
volumes:
  ai-report-data:
    name: crypto-bot_ai-report-data
    driver: local
    driver_opts:
      device: /opt/crypto-bot/ai_report_data
      o: bind
      type: none
  microstructure-data:
    name: crypto-bot_microstructure-data
    driver: local
    driver_opts:
      device: /opt/crypto-bot/data_cache
      o: bind
      type: none
  paper-data:
    name: crypto-bot_paper-data
    driver: local
    driver_opts:
      device: /opt/crypto-bot/data_cache
      o: bind
      type: none
secrets:
  admin_token:
    name: crypto-bot_admin_token
    file: /opt/crypto-bot-ai6b-staging/1e2c262/runtime-secrets/backend/admin_token
  ai_report_provider_key:
    name: crypto-bot_ai_report_provider_key
    file: /opt/crypto-bot-ai6b-staging/1e2c262/runtime-secrets/report-worker/ai_report_provider_key
  legacy_deepseek_key:
    name: crypto-bot_legacy_deepseek_key
    file: /opt/crypto-bot-ai6b-staging/1e2c262/runtime-secrets/backend/legacy_deepseek_key
  tls_certificate:
    name: crypto-bot_tls_certificate
    file: /opt/crypto-bot-ai6b-staging/1e2c262/runtime-secrets/frontend/tls_certificate
  tls_private_key:
    name: crypto-bot_tls_private_key
    file: /opt/crypto-bot-ai6b-staging/1e2c262/runtime-secrets/frontend/tls_private_key
x-ai-budget:
  AI_REPORT_ARCHIVE_MAX_DAYS: "365"
  AI_REPORT_AUDIT_WORKER_CONCURRENCY: "1"
  AI_REPORT_CANARY_MAX_LIVE_REQUESTS: "0"
  AI_REPORT_COST_STATUS: REQUIRES_RUNTIME_AUDIT
  AI_REPORT_DAILY_CURRENCY_CAP_USD: "2"
  AI_REPORT_DAILY_INPUT_TOKENS: "500000"
  AI_REPORT_DAILY_OUTPUT_TOKENS: "1000000"
  AI_REPORT_DAILY_TOTAL_TOKENS: "1500000"
  AI_REPORT_FULL_OUTPUT_TOKENS: "200000"
  AI_REPORT_GLOBAL_CONCURRENCY: "1"
  AI_REPORT_HOT_RETENTION_DAYS: "30"
  AI_REPORT_PER_INSTRUMENT_CONCURRENCY: "1"
  AI_REPORT_POSITION_OUTPUT_TOKENS: "200000"
  AI_REPORT_PRICE_SCHEDULE_VERSION: REQUIRES_RUNTIME_AUDIT
  AI_REPORT_PROVIDER_RETRY_MAX: "3"
  AI_REPORT_QUEUE_MAX: "10"
  AI_REPORT_QUICK_OUTPUT_TOKENS: "200000"
  AI_REPORT_REQUEST_INPUT_TOKEN_MAX: "500000"
  AI_REPORT_TIMEOUT_SECONDS: "300"
  AI_REPORT_WORKER_CONCURRENCY: "1"
x-ai-disabled:
  AI_MACRO_HTTP_FETCH_ENABLED: "false"
  AI_MARKET_ANALYSIS_PRESENTATION_ENABLED: "false"
  AI_MARKET_REPORT_SHADOW_ONLY: "true"
  AI_MARKET_REPORT_WORKER_ENABLED: "false"
  AI_MARKET_REPORTS_ENABLED: "false"
  AI_REPORT_AUDIT_ENABLED: "false"
  AI_REPORT_AUDIT_WORKER_ENABLED: "false"
  AI_REPORT_AUTO_AUDIT_ENABLED: "false"
  AI_REPORT_EVALUATION_ENABLED: "false"
  AI_REPORT_LIVE_PROVIDER_ENABLED: "false"
  AI_USER_POSITION_PLANS_ENABLED: "false"
  AI6B_KILL_SWITCH_AUTOMATION_ENABLED: "true"
  AI6B_PRIVACY_SCOPE_ENFORCED: "true"
x-app-security:
  cap_drop:
    - ALL
  image: sha256:2f8ead2d6a53b060fb3d08ca9364b1febb879e713e599eecf7e58de6757fbef2
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 20m
  read_only: true
  restart: on-failure:3
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /app/logs:rw,noexec,nosuid,size=32m
  user: 10001:10001
