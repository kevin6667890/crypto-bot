x-app-security: &app-security
  image: ${AI6B_APP_IMAGE:?AI6B_APP_IMAGE digest is required}
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /app/logs:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=700
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "on-failure:3"
  logging: &bounded-logs
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

x-ai-disabled: &ai-disabled
  AI_MARKET_REPORTS_ENABLED: "false"
  AI_MARKET_REPORT_WORKER_ENABLED: "false"
  AI_MARKET_REPORT_SHADOW_ONLY: "true"
  AI_USER_POSITION_PLANS_ENABLED: "false"
  AI_MACRO_HTTP_FETCH_ENABLED: "false"
  AI_REPORT_LIVE_PROVIDER_ENABLED: "false"
  AI_REPORT_AUDIT_ENABLED: "false"
  AI_REPORT_AUDIT_WORKER_ENABLED: "false"
  AI_REPORT_AUTO_AUDIT_ENABLED: "false"
  AI_REPORT_EVALUATION_ENABLED: "false"
  AI_MARKET_ANALYSIS_PRESENTATION_ENABLED: "false"
  AI6B_KILL_SWITCH_AUTOMATION_ENABLED: "true"
  AI6B_PRIVACY_SCOPE_ENFORCED: "true"

x-ai-budget: &ai-budget
  # Zero disables only the count gate; token, queue, concurrency, duplicate,
  # retry and kill-switch runaway protections remain mandatory.
  AI_REPORT_CANARY_MAX_LIVE_REQUESTS: "0"
  AI_REPORT_GLOBAL_CONCURRENCY: "1"
  AI_REPORT_PER_INSTRUMENT_CONCURRENCY: "1"
  AI_REPORT_QUEUE_MAX: "10"
  AI_REPORT_REQUEST_INPUT_TOKEN_MAX: "500000"
  AI_REPORT_QUICK_OUTPUT_TOKENS: "200000"
  AI_REPORT_FULL_OUTPUT_TOKENS: "200000"
  AI_REPORT_POSITION_OUTPUT_TOKENS: "200000"
  AI_REPORT_DAILY_INPUT_TOKENS: "500000"
  AI_REPORT_DAILY_OUTPUT_TOKENS: "1000000"
  AI_REPORT_DAILY_TOTAL_TOKENS: "1500000"
  AI_REPORT_TIMEOUT_SECONDS: "300"
  AI_REPORT_DAILY_CURRENCY_CAP_USD: "2"
  AI_REPORT_COST_STATUS: "REQUIRES_RUNTIME_AUDIT"
  AI_REPORT_PRICE_SCHEDULE_VERSION: "REQUIRES_RUNTIME_AUDIT"
  AI_REPORT_WORKER_CONCURRENCY: "1"
  AI_REPORT_AUDIT_WORKER_CONCURRENCY: "1"
  AI_REPORT_PROVIDER_RETRY_MAX: "3"
  AI_REPORT_HOT_RETENTION_DAYS: "30"
  AI_REPORT_ARCHIVE_MAX_DAYS: "365"

services:
  paper-api:
    <<: *app-security
    profiles: [ai6b-candidate]
    command: [python, -m, scripts.run_paper_api_with_secrets]
    environment:
      <<: [*ai-disabled, *ai-budget]
      PAPER_API_HOST: 0.0.0.0
      LIVE_TRADING_ENABLED: "false"
      AI_REPORT_SCHEDULER_CADENCE_SECONDS: "14400"
      AI_REPORT_SCHEDULER_CONFIRMATION_GRACE_SECONDS: "120"
      GIT_COMMIT: ${FACTOR_PROGRAM_GIT_COMMIT:?Factor Program source commit is required}
      PAPER_DB_PATH: /var/lib/paper/paper_trades.db
      MICROSTRUCTURE_DB_PATH: /var/lib/microstructure/market_microstructure.db
      CANONICAL_MICROSTRUCTURE_HISTORY_DB_PATH: /var/lib/microstructure/canonical_microstructure_history_v1.db
      AI_MARKET_REPORT_DB_PATH: /var/lib/ai-report/ai_market_reports.db
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      DEEPSEEK_API_KEY_FILE: /run/secrets/legacy_deepseek_key
    secrets: [admin_token, legacy_deepseek_key]
    volumes:
      - paper-data:/var/lib/paper:rw
      - microstructure-data:/var/lib/microstructure:ro
      - ai-report-data:/var/lib/ai-report:rw
    expose: ["8765"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/paper/flow/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The only queue owner.  The API is deliberately passive so an API restart
  # cannot reconcile or interrupt an in-flight durable research job.
  research-worker:
    <<: *app-security
    profiles: [ai6b-candidate]
    command: [python, -m, scripts.run_auto_research_scheduler]
    environment:
      PAPER_DB_PATH: /var/lib/paper/paper_trades.db
      GIT_COMMIT: ${FACTOR_PROGRAM_GIT_COMMIT:?Factor Program source commit is required}
      RESEARCH_JOB_WORKER_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
      AUTO_RESEARCH_ENABLED: "false"
      AUTO_RESEARCH_INTERVAL_HOURS: "168"
      AUTO_RESEARCH_LOOKBACK_DAYS: "730"
      PROGRAM_DISCOVERY_ENABLED: "true"
      PROGRAM_DISCOVERY_SEARCH_BUDGET: "500"
    volumes:
      - paper-data:/var/lib/paper:rw
    pids_limit: 96
    mem_limit: 1g
    cpus: 0.25

  microstructure-collector:
    <<: *app-security
    profiles: [ai6b-candidate]
    command: [python, -m, dashboard.microstructure_collector]
    environment:
      MICROSTRUCTURE_DB_PATH: /var/lib/microstructure/market_microstructure.db
      CANONICAL_MICROSTRUCTURE_HISTORY_DB_PATH: /var/lib/microstructure/canonical_microstructure_history_v1.db
      MICROSTRUCTURE_MAINTENANCE_ENABLED: "false"
      LIVE_TRADING_ENABLED: "false"
      MICROSTRUCTURE_REALTIME_AGGREGATION_ENABLED: "true"
    volumes:
      - microstructure-data:/var/lib/microstructure:rw
    pids_limit: 128
    mem_limit: 768m
    cpus: 0.60
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8770/health',timeout=12)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  report-worker:
    <<: *app-security
    profiles: [ai6b-candidate]
    command: [python, scripts/run_ai_report_worker.py, --database, /var/lib/ai-report/ai_market_reports.db]
    environment:
      <<: [*ai-disabled, *ai-budget]
      AI_REPORT_API_KEY_FILE: /run/secrets/ai_report_provider_key
      AI_REPORT_KILL_SWITCH_FILE: /var/lib/ai-report/live-provider-disabled.json
    secrets: [ai_report_provider_key]
    volumes:
      - ai-report-data:/var/lib/ai-report:rw
    pids_limit: 64
    mem_limit: 320m
    cpus: 0.30
    # Let an in-flight provider request reach its exactly-once terminal state
    # before a rolling deployment replaces the worker.
    stop_grace_period: 360s
    healthcheck:
      test: [CMD, python, -c, "from dashboard.ai_market_analysis.report_repository import ReportRepository; assert ReportRepository('/var/lib/ai-report/ai_market_reports.db').schema_version()"]
      interval: 30s
      timeout: 5s
      retries: 3

  audit-worker:
    <<: *app-security
    profiles: [ai6b-candidate]
    command: [python, scripts/run_ai_audit_worker.py, --database, /var/lib/ai-report/ai_market_reports.db]
    environment:
      <<: *ai-disabled
      AI_REPORT_KILL_SWITCH_FILE: /var/lib/ai-report/live-provider-disabled.json
    volumes:
      - ai-report-data:/var/lib/ai-report:rw
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.20
    healthcheck:
      test: [CMD, python, -c, "from dashboard.ai_market_analysis.report_audit_repository import AuditRepository; assert AuditRepository('/var/lib/ai-report/ai_market_reports.db').schema_version()"]
      interval: 30s
      timeout: 5s
      retries: 3

  retention-dry-run:
    <<: *app-security
    profiles: [ai6b-maintenance-candidate]
    command: [python, scripts/manage_ai_report_retention.py, archive, --database, /var/lib/ai-report/ai_market_reports.db, --archive-directory, /var/lib/ai-report-archive, --limit, "10"]
    environment:
      <<: *ai-disabled
      AI_REPORT_LOCAL_ARCHIVE_CAP_BYTES: "10737418240"
    volumes:
      - ai-report-data:/var/lib/ai-report:ro
      - ai-report-archive:/var/lib/ai-report-archive:rw
    restart: "no"
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.05

  frontend:
    image: ${AI6B_FRONTEND_IMAGE:?AI6B_FRONTEND_IMAGE digest is required}
    profiles: [ai6b-candidate]
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "on-failure:3"
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=700
      - /var/log/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=700
    volumes:
      - ../nginx-ai6b-production.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [tls_certificate, tls_private_key]
    # Candidate topology: owner-only SSH tunnel to loopback; no public listener.
    ports: ["127.0.0.1:8443:8443"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.10
    logging: *bounded-logs
    depends_on: [paper-api]
    healthcheck:
      test: [CMD-SHELL, "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  paper-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${PAPER_DATA_DIR:?PAPER_DATA_DIR is required}"}
  microstructure-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${MICROSTRUCTURE_DATA_DIR:?MICROSTRUCTURE_DATA_DIR is required}"}
  ai-report-data:
    driver: local
    driver_opts: {type: none, o: bind, device: "${AI_REPORT_DATA_DIR:?AI_REPORT_DATA_DIR is required}"}
  ai-report-archive:
    driver: local
    driver_opts: {type: none, o: bind, device: "${AI_REPORT_ARCHIVE_DIR:?AI_REPORT_ARCHIVE_DIR is required}"}

secrets:
  admin_token: {file: "${ADMIN_TOKEN_FILE:?ADMIN_TOKEN_FILE is required}"}
  legacy_deepseek_key: {file: "${LEGACY_DEEPSEEK_KEY_FILE:?LEGACY_DEEPSEEK_KEY_FILE is required}"}
  ai_report_provider_key: {file: "${AI_REPORT_PROVIDER_KEY_FILE:?AI_REPORT_PROVIDER_KEY_FILE is required}"}
  tls_certificate: {file: "${TLS_CERTIFICATE_FILE:?TLS_CERTIFICATE_FILE is required}"}
  tls_private_key: {file: "${TLS_PRIVATE_KEY_FILE:?TLS_PRIVATE_KEY_FILE is required}"}
