# Production edge override: preserve the established TLS origin topology.
services:
  frontend:
    ports: !override
      - "127.0.0.1:8443:8443"
      - "443:8443"
    volumes:
      - ./deploy/nginx-ai6b-production.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE}
