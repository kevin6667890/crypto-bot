services:
  crypto-bot:
    profiles:
      - ultimate-bot
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data_cache:/app/data_cache
    logging: &bounded-json-logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  dashboard:
    profiles:
      - legacy-dashboard
    build: .
    env_file: .env
    environment:
      PAPER_API_INTERNAL_URL: http://paper-api:8765
      PAPER_API_URL: ${PAPER_API_URL:-}
    command: streamlit run dashboard/streamlit_app.py
    ports:
      - "8502:8501"
    volumes:
      - ./logs:/app/logs
      - ./data_cache:/app/data_cache
    logging: *bounded-json-logs
    restart: unless-stopped

  paper-api:
    build: .
    env_file: .env
    command: python -m dashboard.paper_api
    environment:
      PAPER_API_HOST: 0.0.0.0
      LIVE_TRADING_ENABLED: "false"
      AI_REPORT_SCHEDULER_CADENCE_SECONDS: "14400"
      AI_REPORT_SCHEDULER_CONFIRMATION_GRACE_SECONDS: "120"
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      MICROSTRUCTURE_DB_PATH: /app/data_cache/market_microstructure.db
      CANONICAL_MICROSTRUCTURE_HISTORY_DB_PATH: /app/data_cache/canonical_microstructure_history_v1.db
      RESEARCH_JOB_WORKER_ENABLED: "false"
    volumes:
      - ./data_cache:/app/data_cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/paper/flow/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *bounded-json-logs
    restart: unless-stopped

  research-worker:
    build: .
    env_file: .env
    command: python -m scripts.run_auto_research_scheduler
    environment:
      PAPER_DB_PATH: /app/data_cache/paper_trades.db
      RESEARCH_JOB_WORKER_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
      AUTO_RESEARCH_ENABLED: ${AUTO_RESEARCH_ENABLED:-false}
      AUTO_RESEARCH_INTERVAL_HOURS: ${AUTO_RESEARCH_INTERVAL_HOURS:-24}
      AUTO_RESEARCH_LOOKBACK_DAYS: ${AUTO_RESEARCH_LOOKBACK_DAYS:-730}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      - ./data_cache:/app/data_cache
    logging: *bounded-json-logs
    restart: unless-stopped

  microstructure-collector:
    build: .
    command: python -m dashboard.microstructure_collector
    environment:
      MICROSTRUCTURE_DB_PATH: /app/data_cache/market_microstructure.db
      CANONICAL_MICROSTRUCTURE_HISTORY_DB_PATH: /app/data_cache/canonical_microstructure_history_v1.db
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      MICROSTRUCTURE_MAINTENANCE_ENABLED: "false"
      MICROSTRUCTURE_REALTIME_AGGREGATION_ENABLED: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data_cache:/app/data_cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8770/health', timeout=12)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    logging: *bounded-json-logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:80"
    depends_on:
      - paper-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *bounded-json-logs
    restart: unless-stopped
